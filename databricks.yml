bundle:
  name: agent_openai_agents_sdk

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-openai-agents-sdk"
      description: "OpenAI Agents SDK agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2451180342646156"
            permission: 'CAN_MANAGE'
        # The Supervisor Agent endpoint that powers the chat UI.
        # NOTE: the supervisor orchestrates other agents. If you add agent endpoints to the
        # supervisor, grant the app service principal CAN_QUERY on each of them here too.
        - name: 'supervisor-endpoint'
          serving_endpoint:
            name: 'mas-67183f47-endpoint'
            permission: 'CAN_QUERY'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-openai-agents-sdk
